<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EDD7A3">
    <title>404 — Strona nie istnieje | Pracownia Szopa</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Copse&family=Zalando+Sans+Expanded:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #FDF9F2; font-family: 'Copse', Georgia, serif; color: #13110F; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .error-container { text-align: center; max-width: 600px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .error-code { font-size: 120px; font-weight: 700; color: #C4411D; margin: 0; line-height: 1; letter-spacing: -2px; text-shadow: 4px 4px 0px #13110F; }
        .error-title { font-size: 28px; margin: 0; font-weight: 700; line-height: 1.3; }
        .error-descr { font-size: 16px; line-height: 1.6; opacity: 0.8; margin: 0; font-family: sans-serif; }
        .back-btn { background: #C4411D; color: #EDD7A3; border: 3px solid #13110F; padding: 12px 28px; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; border-radius: 16px; box-shadow: 0 5px 0 #13110F; text-decoration: none; transition: all 0.1s ease; display: inline-block; }
        .back-btn:hover { background: #258495; transform: translateY(2px); box-shadow: 0 3px 0 #13110F; }
        .back-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #13110F; }
        .horizontal-paws-divider { width: 100%; max-width: 320px; display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .horizontal-paws-divider .p-foot { font-size: 24px; opacity: 0.4; display: inline-block; }
        .horizontal-paws-divider .p-foot:nth-child(odd) { transform: rotate(75deg) scale(0.9); }
        .horizontal-paws-divider .p-foot:nth-child(even) { transform: rotate(105deg) scale(0.9); }
        @media (max-width: 768px) { .error-code { font-size: 90px; } .error-title { font-size: 22px; } .error-descr { font-size: 14px; } }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        
        <h1 class="error-title">Ups... Ktoś tu pomylił ścieżki! 🐾</h1>
        
        <div class="horizontal-paws-divider">
            <span class="p-foot">🐾</span>
            <span class="p-foot">🐾</span>
            <span class="p-foot">🐾</span>
            <span class="p-foot">🐾</span>
            <span class="p-foot">🐾</span>
        </div>

        <p class="error-descr">
            Strona, której szukasz, prawdopodobnie schowała się w cieniu или nigdy nie istniała. 
            Ale nie martw się — światło witraży zawsze wskaże Ci właściwą drogę обратно!
        </p>
        
        <a href="index.html" class="back-btn">Wróć do pracowni</a>
    </div>

</body>
</html>
